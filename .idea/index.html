<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom's Crappy Pokedex</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <nav>
        <h1>Pokedex</h1>
    </nav>
</header>
<main>
    <section>
        <div class = "searchBar">
            <form action="">
                <input type="text" placeholder="Find Pokemon..." id="searchBox">
                <button type="submit" id="searchButton">Search</button>
            </form>
        </div>
        <div class="pokemon-container" id="pokemonContainer">
            <h2>What Pokemon would you like to learn about?</h2>
        </div>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
